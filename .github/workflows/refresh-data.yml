name: Refresh data

# Backblaze publishes Drive Stats quarterly with a ~4-6 week lag. This runs
# monthly: when a new quarter's ZIP appears, it re-ingests the latest four
# quarters, reruns the full pipeline (with LSTM), and commits the refreshed
# dashboard payload — the deployed site updates itself, no manual steps.

on:
  schedule:
    - cron: "17 3 15 * *"   # 15th of every month, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU torch for the LSTM ensemble)
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Detect and ingest newest quarter
        id: refresh
        run: |
          python data/auto_refresh.py | tee refresh.log
          echo "updated=$(grep -c '^UPDATED' refresh.log || true)" >> "$GITHUB_OUTPUT"

      - name: Run pipeline on refreshed data
        if: steps.refresh.outputs.updated == '1'
        run: |
          python StorageIQ_Pipeline.py
          cp outputs/dashboard_data.json StorageIQ_Dashboard/dashboard_data.json

      - name: Commit refreshed analytics
        if: steps.refresh.outputs.updated == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add StorageIQ_Dashboard/dashboard_data.json
          git commit -m "data: auto-refresh with latest Backblaze quarter"
          git push
